name: Tests and reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests and quick pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked reference environment
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Unit and consistency tests
        run: python -m pytest
      - name: Quick pipeline smoke run
        run: python -m option_hedging reproduce --quick --output results/quick

  full-reproduction:
    name: Full scientific reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked reference environment
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Verify committed scientific outputs
        run: python -m option_hedging verify --force

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-pricing-delta-hedging"
version = "1.0.4"
description = "Fully reproducible Black–Scholes option-pricing and discrete delta-hedging study"
requires-python = ">=3.11"
authors = [{name = "Zhengli Ji"}]
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
option-hedging = "option_hedging.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
